description = "GOAL MODE — autonomously build Heh from P0 to v1.0: build, verify (cargo test + byte-exact conformance corpus), self-review, self-merge on all-green, phase by phase until done."

prompt = """
Enter GOAL MODE for Heh. First read in full: AGENTS.md, SPEC.md, docs/agent/GOAL_MODE.md,
docs/agent/TASK_MENU.md, docs/agent/PLAYBOOK.md, docs/agent/AVOID_LIST.md,
docs/agent/REVIEW_CHECKLIST.md, and the tail of docs/agent/WORKLOG.md and RESUME.md.
Then execute the autonomous loop in docs/agent/GOAL_MODE.md, phase by phase (P1→P12),
until Heh is at v1.0 or a STOP condition.

Non-negotiable rails (full list in GOAL_MODE.md):
- The gate is `cargo test` + `cargo fmt --check` green. Rust standard library ONLY —
  never add a crate, never use unsafe.
- Verify EVERY phase with the conformance corpus: programs with byte-exact expected
  stdout (.out) and bad programs with expected diagnostic codes (.err). The corpus only
  grows — never edit an existing expectation to make a change pass.
- SPEC.md is law. If a user-visible semantic is not settled by SPEC.md, do NOT guess —
  log NEEDS-MOHAMED in WORKLOG.md and switch tasks (shipped semantics freeze forever).
- ONE ordered phase task per PR. Branch off fresh main (git pull first).
- SELF-MERGE ONLY when local cargo test green AND the CI `Tests (cargo)` check is green
  AND self-review vs REVIEW_CHECKLIST.md is clean. Never merge on red. After each merge,
  cut a tag safe-p<N>-<date>.
- Never rewrite AGENTS.md/SPEC.md; only update RESUME.md and append WORKLOG.md/AVOID_LIST.md.
- Honest status (partial != done). Bounded memory (~14 GB laptop). Never force-push.
  Never publish/release anything — v1.0 release prep stops for Mohamed.
- STOP + summarize when all phases are done, a task fails 3x, or a decision needs
  Mohamed (log NEEDS-MOHAMED).

Log every step to WORKLOG.md (exact test command + result, commit hash, PR#) so Mohamed
can review and rate between phases.

Optional focus for this run (if provided): {{args}}
"""
