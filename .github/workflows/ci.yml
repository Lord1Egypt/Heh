name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked 2>/dev/null || cargo build
      - name: Tests
        run: cargo test
